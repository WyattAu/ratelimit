[package]
name = "ratelimit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Rate limiting for Rust — GCRA algorithm with in-memory and Redis backends, Tower layer integration"
readme = "README.md"
repository = "https://github.com/WyattAu/ratelimit"

[dependencies]
tokio = { version = "1", features = ["time", "sync", "rt"] }
dashmap = { version = "6", optional = true }
async-trait = "0.1"
thiserror = "2"

tower = { version = "0.5", optional = true }
tower-layer = { version = "0.3", optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
redis = { version = "0.25", optional = true, features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"

[features]
default = ["in-memory"]
in-memory = ["dep:dashmap"]
sliding-window = ["dep:dashmap"]
redis = ["dep:redis"]
tower = ["dep:tower", "dep:tower-layer", "dep:http", "dep:axum"]

[[bench]]
name = "ratelimit_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
