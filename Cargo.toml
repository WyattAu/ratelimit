[package]
name = "throttle-kit"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Rate limiting for Rust — GCRA algorithm with in-memory and Redis backends, Tower layer integration"
readme = "README.md"
repository = "https://github.com/WyattAu/ratelimit"
keywords = ["rate-limit", "gcra", "throttle"]
categories = ["web-programming"]
exclude = ["/target", "/fuzz"]

[dependencies]
tokio = { version = "1", features = ["time", "sync", "rt"] }
dashmap = { version = "6", optional = true }
async-trait = "0.1"
thiserror = "2"

tower = { version = "0.5", optional = true }
tower-layer = { version = "0.3", optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
redis = { version = "0.25", optional = true, features = ["tokio-comp", "connection-manager"] }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
tracing = "0.1"
metrics = { version = "0.24", optional = true }

[features]
default = ["in-memory"]
in-memory = ["dep:dashmap"]
sliding-window = ["dep:dashmap"]
redis = ["dep:redis"]
tower = ["dep:tower", "dep:tower-layer", "dep:http", "dep:axum"]
metrics = ["dep:metrics"]
sqlite = ["dep:rusqlite"]

[[bench]]
name = "ratelimit_bench"
harness = false

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_hot_path.rs.
[[bench]]
name = "iai_hot_path"
harness = false

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
iai-callgrind = "0.16"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
